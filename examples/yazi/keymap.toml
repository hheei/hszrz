[mgr]
prepend_keymap = [
  # Download: Send selected file(s) or hovered file to local machine via hsz
  { on = "<C-d>", run = 'shell "hsz %s" --block', desc = "Download (hsz send)" },

  # Upload: Receive file from remote machine into current directory via hrz
  { on = "<C-u>", run = 'shell "hrz" --block',    desc = "Upload (hrz receive)" },
]
