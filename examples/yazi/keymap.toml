[mgr]
prepend_keymap = [
  # Upload: Send selected file(s) or hovered file via hsz
  { on = "<C-u>", run = 'shell "hsz %s" --block', desc = "Upload (hsz send)" },

  # Download: Receive file into current directory via hrz
  { on = "<C-d>", run = 'shell "hrz" --block',    desc = "Download (hrz receive)" },
]
