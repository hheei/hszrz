name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build target
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE="hszrz-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          ln -sf hszrz hsz
          ln -sf hszrz hrz
          tar -czf "../../../$ARCHIVE" hszrz hsz hrz
          cd ../../..
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
        shell: bash

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          $ARCHIVE = "hszrz-${{ matrix.target }}.zip"
          Copy-Item target\${{ matrix.target }}\release\hszrz.exe target\${{ matrix.target }}\release\hsz.exe
          Copy-Item target\${{ matrix.target }}\release\hszrz.exe target\${{ matrix.target }}\release\hrz.exe
          Compress-Archive -Path target\${{ matrix.target }}\release\hszrz.exe, target\${{ matrix.target }}\release\hsz.exe, target\${{ matrix.target }}\release\hrz.exe -DestinationPath $ARCHIVE
          echo "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
